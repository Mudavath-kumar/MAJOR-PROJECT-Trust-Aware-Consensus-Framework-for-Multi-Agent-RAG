# ─── TrustRAG — Render Blueprint ─────────────────────────────────────────────
# Deploys 2 services on Render Free Tier (No Credit Card Required):
#   1. AI Service (FastAPI + ChromaDB Docker container)
#   2. Backend (Node.js / Express + MongoDB)
# Frontend is deployed on Vercel: https://vercel.com
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── 1. AI Service (FastAPI + ChromaDB) ──────────────────────────────────────
  - type: web
    name: trustrag-ai-service
    runtime: docker
    dockerfilePath: ./Dockerfile.ai-service
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CHROMA_DB_PATH
        value: /chroma_db
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: GOOGLE_API_KEY
        sync: false   # set via Render dashboard
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PORT
        value: "8000"
      - key: PYTHON_ENV
        value: production

  # ── 2. Backend (Express + MongoDB) ──────────────────────────────────────────
  - type: web
    name: trustrag-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && node dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: MONGODB_URI
        sync: false    # MongoDB Atlas free tier connection string
      - key: JWT_SECRET
        generateValue: true
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          name: trustrag-ai-service
          type: web
          property: host
      - key: FRONTEND_URL
        sync: false    # Your Vercel frontend URL (e.g. https://your-project.vercel.app)
      - key: BACKBLAZE_KEY_ID
        sync: false
      - key: BACKBLAZE_APPLICATION_KEY
        sync: false
      - key: BACKBLAZE_BUCKET_NAME
        sync: false
