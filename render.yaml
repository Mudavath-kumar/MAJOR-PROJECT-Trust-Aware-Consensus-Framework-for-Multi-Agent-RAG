# ─── TrustRAG — Render Blueprint ─────────────────────────────────────────────
# Deploys 2 services on Render Free Tier (No Credit Card Required):
#   1. AI Service  — FastAPI + ChromaDB (Docker)
#   2. Backend     — Node.js Express + MongoDB Atlas
# Frontend is deployed separately on Vercel (100% free, no card needed)
#
# HOW TO DEPLOY:
#   1. Push this file to GitHub (it's already there!)
#   2. Go to https://dashboard.render.com/blueprints → New Blueprint
#   3. Connect your GitHub repo, leave Blueprint Path blank, branch = main
#   4. Click Apply — then fill in secrets (GOOGLE_API_KEY, MONGODB_URI, etc.)
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── 1. AI Service (FastAPI + ChromaDB) ──────────────────────────────────────
  - type: web
    name: trustrag-ai-service
    runtime: docker
    dockerfilePath: ./Dockerfile.ai-service
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CHROMA_DB_PATH
        value: /chroma_db
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PORT
        value: "8000"
      - key: PYTHON_ENV
        value: production

  # ── 2. Backend (Express + MongoDB) ──────────────────────────────────────────
  - type: web
    name: trustrag-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && node dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          name: trustrag-ai-service
          type: web
          property: host
      - key: FRONTEND_URL
        sync: false
      - key: BACKBLAZE_KEY_ID
        sync: false
      - key: BACKBLAZE_APPLICATION_KEY
        sync: false
      - key: BACKBLAZE_BUCKET_NAME
        sync: false
