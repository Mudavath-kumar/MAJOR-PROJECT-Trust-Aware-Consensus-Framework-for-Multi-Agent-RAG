# ─── TrustRAG — Render Blueprint ─────────────────────────────────────────────
# Deploys 2 services on Render Free Tier (No Credit Card Required):
#   1. AI Service  — FastAPI + MongoDB Atlas Vector Search (Docker)
#   2. Backend     — Node.js Express + MongoDB Atlas
# Frontend is deployed separately on Vercel (100% free, no card needed)
#
# HOW TO DEPLOY:
#   1. Push this file to GitHub (it's already there!)
#   2. Go to https://dashboard.render.com/blueprints → New Blueprint
#   3. Connect your GitHub repo, leave Blueprint Path blank, branch = main
#   4. Click Apply — then fill in secrets (GEMINI_API_KEY, MONGODB_URI, etc.)
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── 1. AI Service (FastAPI + MongoDB Atlas Vector Search) ───────────────────
  - type: web
    name: trustrag-ai-service
    runtime: docker
    dockerfilePath: ./Dockerfile.ai-service
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: EMBEDDING_MODEL_NAME
        value: gemini-embedding-2
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: BACKEND_URL
        fromService:
          name: trustrag-backend-j3oe
          type: web
          property: host
      - key: PORT
        value: "8000"
      - key: PYTHON_ENV
        value: production

  # ── 2. Backend (Express + MongoDB) ──────────────────────────────────────────
  - type: web
    name: trustrag-backend-j3oe
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: SETTINGS_ENCRYPTION_KEY
        sync: false
      # Render's hostport is the private-network hostname and port. The backend
      # normalises it to http://... for service-to-service traffic.
      - key: AI_SERVICE_URL
        fromService:
          name: trustrag-ai-service
          type: web
          property: hostport
      - key: FRONTEND_URL
        sync: false
      - key: RENDER_EXTERNAL_URL
        fromService:
          name: trustrag-backend-j3oe
          type: web
          property: host
      # ── Auth: required for Clerk JWT verification ──────────────────────────
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # ── CORS: allow the Vercel frontend to call the backend ───────────────
      # Set this to your Vercel deployment URL, e.g.:
      # https://major-project-trust-aware-consensus.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: B2_REGION
        value: us-east-005
